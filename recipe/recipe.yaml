context:
  version: 0.2.27

package:
  name: ctransformers
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/ctransformers/ctransformers-${{ version }}.tar.gz
  sha256: 25653d4be8a5ed4e2d3756544c1e9881bf95404be5371c3ed506a256c28663d5

build:
  number: 2
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('cxx') }}
    - cmake >=3.18
    - make
    - ninja
    - if: build_platform != target_platform
      then:
        - cross-python_${{ target_platform }}
        - python
  host:
    - python
    - pip
    - scikit-build >=0.13
    - setuptools >=42
  run:
    - python
    - huggingface_hub
    - py-cpuinfo <10.0.0,>=9.0.0

tests:
  - python:
      imports:
        - ctransformers

about:
  summary: Python bindings for the Transformer models implemented in C/C++ using GGML library.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/marella/ctransformers

extra:
  recipe-maintainers:
    - danielnachun
    - raybellwaves
